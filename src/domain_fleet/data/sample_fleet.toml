# Offline demo fleet for Domain Fleet Diff.
# Names are sample fixtures for tests and `domain-fleet scan`. They are not
# credentials, and the observations below are synthetic. Nothing here is a token.
#
# Hub pattern: grummpy/my_domains is the registry. Each site repo is pushed by
# one dedicated bot and deploys to its own Hostinger website. This file is the
# registry those bots and the owner share.

schema = 1

[hub]
repo = "grummpy/my_domains"
branch = "main"
role = "Registry only. One record per domain, the site repo, and the bot allowed to push. The hub does not host the sites."

[policy]
stale_commit_days = 90
min_content_files = 2

[[sites]]
slug = "saltydogcustoms"
domain = "saltydogcustoms.com"
name = "Salty Dog Customs"
bot = "saltydog-bot"
github_repo = "grummpy/saltydogcustoms"
brand_markers = ["Salty Dog"]
php_version = "8.2"
ssl = true
document_root = "public_html"

[sites.hostinger]
title = "Salty Dog Customs | Boat lettering and vinyl"
body_excerpt = "Salty Dog Customs paints hull names and vinyl. Browse the gallery and request a quote."
