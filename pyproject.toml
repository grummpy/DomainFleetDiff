[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "domain-fleet-diff"
version = "0.1.0"
description = "Scan a multi-site Hostinger and GitHub fleet, classify stub vs live, and print a merge-ready checklist."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "grummpy" }]
keywords = ["domains", "hostinger", "github", "fleet", "deploy"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
domain-fleet = "domain_fleet.cli:main"

[project.urls]
Homepage = "https://github.com/grummpy/DomainFleetDiff"
Repository = "https://github.com/grummpy/DomainFleetDiff"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
domain_fleet = ["data/*.toml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
